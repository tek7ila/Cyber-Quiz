<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091323"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><title>Cybersecurity Quiz — Unlock</title><style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#091323;color:#f0f6ff;min-height:100svh;display:grid;place-items:center;margin:0;padding:24px;box-sizing:border-box}.box{width:min(100%,440px);background:#172943;border:1px solid #385577;border-radius:25px;padding:30px 24px}h1{font-size:27px}p{color:#b4c9e3;line-height:1.55}input[type=password]{width:100%;box-sizing:border-box;font-size:18px;padding:15px;border-radius:12px;border:1px solid #6a83a8;background:#0b1a2d;color:white}button{width:100%;border:0;background:#5b94f2;color:#08182c;font-weight:750;padding:15px;border-radius:12px;font-size:17px;margin-top:20px}.remember{display:flex;align-items:center;gap:11px;margin-top:18px;color:#d1e2f6}.remember input{width:19px;height:19px}.hint{font-size:13px}</style></head><body><div class="box"><div style="font-size:42px">🔐</div><h1>Cybersecurity Quiz</h1><p>Unlock your question bank to continue studying.</p><form id="gate"><label for="pass">Password</label><input type="password" id="pass" required autocomplete="current-password" placeholder="Enter your password"><label class="remember"><input type="checkbox" id="remember">Remember unlock on this device</label><button id="open">Unlock quiz</button></form><p id="status" role="status"></p><p class="hint">Remembering unlock stores a device-local cryptographic key, not your password. Anyone with access to this unlocked device/browser profile may access the quiz. Use Lock and forget device access in the dashboard to remove it.</p></div><script>
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
const $=id=>document.getElementById(id),sta=$('status');
function db(){return new Promise((ok,fail)=>{let r=indexedDB.open('CyberQuizKeysV3',1);r.onupgradeneeded=()=>r.result.createObjectStore('keys');r.onsuccess=()=>ok(r.result);r.onerror=()=>fail(r.error)})}
async function getKey(){const d=await db();return new Promise((ok,fail)=>{let t=d.transaction('keys','readonly');let r=t.objectStore('keys').get('device');r.onsuccess=()=>ok(r.result);r.onerror=()=>fail(r.error)})}
async function setKey(v){const d=await db();return new Promise((ok,fail)=>{let t=d.transaction('keys','readwrite');t.objectStore('keys').put(v,'device');t.oncomplete=ok;t.onerror=()=>fail(t.error)})}
async function forget(){const d=await db();return new Promise((ok,fail)=>{let t=d.transaction('keys','readwrite');t.objectStore('keys').delete('device');t.oncomplete=ok;t.onerror=()=>fail(t.error)})}
window.cqForgetDevice=forget;
async function run(key){let r=await fetch('./quiz.dat');if(!r.ok)throw Error('quiz.dat not found');let data=new Uint8Array(await r.arrayBuffer());if(String.fromCharCode(...data.slice(0,4))!=='CQP1')throw Error('Invalid encrypted file');const iv=data.slice(20,32);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:new TextEncoder().encode('CybersecurityQuiz-PWA-v1')},key,data.slice(32));let html=new TextDecoder().decode(clear);
// Keep the credential erasure callback across document.open() by injecting a script into the decoded app.
const ct='</scr'+'ipt>';html=html.replace(ct+'</body>',ct+'<script>window.cqDb='+db.toString()+';window.cqForgetDevice=async()=>{const d=await window.cqDb();return new Promise((ok,fail)=>{const t=d.transaction("keys","readwrite");t.objectStore("keys").delete("device");t.oncomplete=ok;t.onerror=()=>fail(t.error)})};'+ct+'</body>');
document.open();document.write(html);document.close()}
$('gate').onsubmit=async e=>{e.preventDefault();$('open').disabled=true;sta.textContent='Decrypting…';try{const pw=$('pass').value,bytes=new Uint8Array(await(await fetch('./quiz.dat')).arrayBuffer());const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes.slice(4,20),iterations:650000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);const remember=$('remember').checked; // Verify the password by decryption before saving it.
await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(20,32),additionalData:new TextEncoder().encode('CybersecurityQuiz-PWA-v1')},key,bytes.slice(32));if(remember)await setKey(key);else await forget();await run(key)}catch(err){sta.textContent=err.name==='OperationError'?'Incorrect password. Try again.':'Could not unlock: '+err.message;$('open').disabled=false}};
(async()=>{try{const key=await getKey();if(key){sta.textContent='Unlocking saved device…';try{await run(key)}catch{await forget();sta.textContent='Saved access has expired. Enter your password.'}}}catch{}})();
</script></body></html>
